<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dam⚡벼락</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#181614;
  --surface:#211f1c;
  --surface2:#272420;
  --border:rgba(255,248,220,0.1);
  --border2:rgba(255,248,220,0.2);
  --text:#f2ede0;
  --text2:rgba(242,237,224,0.65);
  --text3:rgba(242,237,224,0.38);
  --accent:#FFD23F;
  --accent2:#FF6B35;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;
  background:rgba(24,22,20,0.96);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
}
.logo{display:flex;align-items:center;gap:2px;text-decoration:none}
.logo-dam{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);letter-spacing:3px;line-height:1}
.logo-bolt{display:inline-flex;align-items:center;margin:0 1px;animation:zap 3s ease-in-out infinite}
.logo-bolt svg{width:22px;height:28px;filter:drop-shadow(0 0 5px rgba(255,210,63,0.7))}
@keyframes zap{0%,80%,100%{transform:none}85%{transform:scale(1.4) rotate(-12deg)}90%{transform:scale(0.9) rotate(6deg)}95%{transform:scale(1.1)}}
.logo-rest{font-family:'Black Han Sans',sans-serif;font-size:20px;color:var(--text);letter-spacing:-0.5px}
.logo-tag{font-size:12px;color:var(--text3);margin-left:10px}
.header-right{display:flex;align-items:center;gap:10px}
.topic-pill{
  font-size:13px;font-weight:500;color:var(--accent);
  background:rgba(255,210,63,0.1);border:1px solid rgba(255,210,63,0.25);
  border-radius:20px;padding:5px 14px;cursor:pointer;transition:all .2s;
  max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.topic-pill:hover{background:rgba(255,210,63,0.18)}
.live-wrap{display:flex;align-items:center;gap:5px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 7px #4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-txt{font-size:11px;font-weight:700;color:#4ade80;letter-spacing:1px}

/* ── TABS ── */
.tabs{display:flex;padding:0 24px;background:rgba(24,22,20,0.9);border-bottom:1px solid var(--border)}
.tab{font-size:14px;font-weight:500;padding:12px 18px;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.panel{display:none;padding:24px}.panel.active{display:block}

/* ── INPUT ZONE ── */
.input-zone{
  background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);padding:16px 18px;margin-bottom:20px;
}
.input-top{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
@media(max-width:560px){.input-top{grid-template-columns:1fr;gap:8px}}
.field-group{display:flex;flex-direction:column;gap:5px}
.field-lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.3px}
.field-input{
  background:rgba(255,248,220,0.05);
  border:none;border-bottom:1.5px solid var(--border2);
  color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;
  padding:7px 4px;width:100%;transition:border-color .2s;
}
.field-input:focus{outline:none;border-bottom-color:var(--accent)}
.field-input::placeholder{color:var(--text3);font-size:13px}
.post-btn{
  height:38px;padding:0 20px;
  background:var(--accent);color:#1a1814;
  font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;
  border:none;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:background .15s,transform .1s;flex-shrink:0;
}
.post-btn:hover{background:#ffe055}
.post-btn:active{transform:scale(.97)}
.input-bottom{display:flex;align-items:center;gap:8px}
.color-label{font-size:12px;color:var(--text3);flex-shrink:0}
.swatches{display:flex;gap:6px}
.swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0}
.swatch.active{transform:scale(1.3);border-color:rgba(255,255,255,0.8)}
.nick-divider{width:1px;height:16px;background:var(--border2);flex-shrink:0;margin:0 4px}
.nick-label{font-size:12px;color:var(--text3);flex-shrink:0}
.nick-badge{font-size:12px;color:var(--accent);font-weight:600;background:rgba(255,210,63,0.1);padding:2px 10px;border-radius:10px;border:1px solid rgba(255,210,63,0.2)}

/* ── WALL ── */
.wall-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.wall-count{font-size:13px;font-weight:500;color:var(--text2)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:4px 12px;border-radius:16px;border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:all .15s;background:transparent}
.chip.active{background:rgba(255,210,63,0.12);border-color:rgba(255,210,63,0.5);color:var(--accent)}
.wall{columns:4 160px;column-gap:12px}
@media(max-width:520px){.wall{columns:2 140px}}
.note{
  break-inside:avoid;margin-bottom:12px;
  border-radius:6px;padding:14px 12px 10px;
  position:relative;word-break:break-word;
  box-shadow:2px 3px 10px rgba(0,0,0,0.35);
  transition:transform .18s,box-shadow .18s;
}
.note:nth-child(5n+1){transform:rotate(-1.6deg)}
.note:nth-child(5n+2){transform:rotate(1.1deg)}
.note:nth-child(5n+3){transform:rotate(-0.5deg)}
.note:nth-child(5n+4){transform:rotate(1.8deg)}
.note:nth-child(5n+5){transform:rotate(-1.2deg)}
.note:hover{box-shadow:4px 6px 16px rgba(0,0,0,0.45);z-index:2}
.note:nth-child(5n+1):hover{transform:rotate(-1.6deg) scale(1.03)}
.note:nth-child(5n+2):hover{transform:rotate(1.1deg) scale(1.03)}
.note:nth-child(5n+3):hover{transform:rotate(-0.5deg) scale(1.03)}
.note:nth-child(5n+4):hover{transform:rotate(1.8deg) scale(1.03)}
.note:nth-child(5n+5):hover{transform:rotate(-1.2deg) scale(1.03)}
@keyframes noteIn{from{opacity:0;transform:scale(.85) translateY(-10px)}to{opacity:1}}
.note{animation:noteIn .22s ease}
.note-del{position:absolute;top:6px;right:8px;background:none;border:none;cursor:pointer;font-size:15px;opacity:0;transition:opacity .15s;color:inherit;padding:0;line-height:1}
.note:hover .note-del{opacity:.5}
.note-nick{font-size:11px;font-weight:700;opacity:.6;margin-bottom:4px;letter-spacing:0.2px}
.note-target{font-size:11px;opacity:.55;margin-bottom:4px;font-weight:600}
.note-text{font-size:15px;line-height:1.65;font-weight:400}
.note-divider{border:none;border-top:1px dashed rgba(0,0,0,0.15);margin:8px 0}
.note-keywords{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.kw{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,0.14);letter-spacing:0.2px}
.note-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;letter-spacing:0.2px}
.note-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.note-time{font-size:10px;opacity:.35}
.like-btn{
  display:inline-flex;align-items:center;gap:3px;
  font-size:12px;font-weight:700;
  background:rgba(0,0,0,0.1);border:1px solid rgba(0,0,0,0.12);
  border-radius:16px;padding:3px 9px;cursor:pointer;
  transition:all .15s;color:inherit;user-select:none;
}
.like-btn:hover{background:rgba(220,50,50,0.15);border-color:rgba(220,50,50,0.35)}
.like-btn.liked{background:rgba(220,50,50,0.18);border-color:rgba(220,50,50,0.45)}
.heart{font-size:13px;transition:transform .15s}
.like-btn:active .heart{transform:scale(1.5)}
.empty-wall{
  text-align:center;padding:56px 24px;
  color:var(--text3);font-size:15px;line-height:2.2;
  border:1.5px dashed var(--border2);border-radius:12px;
}

/* ── ANALYSIS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);line-height:1;margin-bottom:3px}
.stat-l{font-size:12px;font-weight:500;color:var(--text2)}
.analysis-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.analysis-btn{font-size:13px;font-weight:500;padding:8px 15px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;transition:all .18s}
.analysis-btn:hover{background:rgba(255,210,63,0.08);border-color:rgba(255,210,63,0.4);color:var(--accent)}
.analysis-refresh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.analysis-update-time{font-size:12px;color:var(--text3)}
.refresh-btn{font-size:12px;font-weight:600;padding:6px 14px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .18s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.analysis-grid{grid-template-columns:1fr}}
.full-width{grid-column:1/-1}
.result-empty{color:var(--text3);font-style:italic}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.result-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.result-body{font-size:13px;line-height:1.85;color:var(--text2);white-space:pre-wrap}

/* ── RANKING ── */
.ranking-list{display:flex;flex-direction:column;gap:8px}
.rank-item{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;
  transition:border-color .15s;
}
.rank-item:hover{border-color:var(--border2)}
.rank-item.rank-1{border-color:rgba(255,210,63,0.4);background:rgba(255,210,63,0.05)}
.rank-item.rank-2{border-color:rgba(200,200,200,0.3)}
.rank-item.rank-3{border-color:rgba(205,127,50,0.35)}
.rank-medal{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.rank-num{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text3);flex-shrink:0;width:32px;text-align:center}
.rank-note{flex:1;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.55;word-break:break-word;min-width:0}
.rank-note-nick{font-size:10px;font-weight:700;opacity:.55;margin-bottom:3px}
.rank-note-target{font-size:10px;opacity:.5;margin-bottom:3px;font-weight:600}
.rank-note-text{font-size:14px;font-weight:500}
.rank-note-kws{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.rank-kw{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,0.14)}
.rank-likes{font-size:15px;font-weight:700;color:var(--accent2);flex-shrink:0;display:flex;align-items:center;gap:4px}
.no-votes{text-align:center;padding:48px 24px;color:var(--text3);font-size:14px;line-height:2.2}
.rank-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.rank-title-txt{font-size:15px;font-weight:700;color:var(--text)}
.reset-btn{font-size:12px;font-weight:500;padding:6px 13px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;transition:all .18s}
.reset-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── STATS ── */
.stats-section{margin-bottom:24px}
.stats-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px;letter-spacing:0.3px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{font-size:12px;font-weight:500;color:var(--text2);width:110px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:9px;background:rgba(255,255,255,0.06);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.bar-val{font-size:12px;color:var(--text3);width:22px;flex-shrink:0;text-align:right}
.color-dist-row{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-bottom:10px}
.color-seg{transition:flex .6s ease}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.legend-item{font-size:12px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:5px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stats-result-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-top:16px;animation:fadeUp .25s ease}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.modal{background:#242018;border:1px solid var(--border2);border-radius:14px;padding:26px;width:min(440px,90vw)}
.modal-title{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:18px;line-height:1.7}
.modal-input{width:100%;background:rgba(255,248,220,0.05);border:none;border-bottom:1.5px solid var(--border2);padding:8px 4px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;margin-bottom:18px;transition:border-color .2s}
.modal-input:focus{outline:none;border-bottom-color:var(--accent)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{font-size:13px;font-weight:500;padding:8px 15px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer}
.btn-solid{font-size:13px;font-weight:700;padding:8px 18px;border-radius:8px;border:none;background:var(--accent);color:#1a1814;cursor:pointer}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCugq74cAopQflgAQSE0re4URj3grqDk8",
  authDomain: "dambyeorak-caa0a.firebaseapp.com",
  databaseURL: "https://dambyeorak-caa0a-default-rtdb.firebaseio.com",
  projectId: "dambyeorak-caa0a",
  storageBucket: "dambyeorak-caa0a.firebasestorage.app",
  messagingSenderId: "534927296018",
  appId: "1:534927296018:web:9e415f054ca05c7a67facb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const notesRef = ref(db, 'notes');
const topicRef = ref(db, 'topic');

// Firebase → 전역 노출
window._fbSet = (path, data) => set(ref(db, path), data);
window._fbOnNotes = (cb) => onValue(notesRef, snap => cb(snap.val()));
window._fbOnTopic = (cb) => onValue(topicRef, snap => cb(snap.val()));
window._fbSetTopic = (v) => set(topicRef, v);
</script>
</head>
<body>

<header>
  <a class="logo" href="#">
    <span class="logo-dam">Dam</span>
    <span class="logo-bolt">
      <svg viewBox="0 0 22 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="15,1 5,16 11,16 8,27 19,11 12,11" fill="#FFD23F" stroke="#FF6B35" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="logo-rest">벼락</span>
    <span class="logo-tag">— 팀 아이디어 담벼락</span>
  </a>
  <div class="header-right">
    <div class="topic-pill" id="topicPill" onclick="openModal()">✦ 주제 설정하기</div>
    <div class="live-wrap">
      <div class="live-dot"></div>
      <span class="live-txt">LIVE</span>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('board',this)">🧱 담벼락</button>
  <button class="tab" onclick="switchTab('analysis',this)">⚡ 분석</button>
  <button class="tab" onclick="switchTab('ranking',this)">🏆 공감랭킹</button>
  <button class="tab" onclick="switchTab('stats',this)">📊 통계</button>
</div>

<!-- BOARD -->
<div class="panel active" id="panel-board">
  <div class="input-zone">
    <div class="input-top">
      <div class="field-group">
        <label class="field-lbl" for="targetInput">👤 대상</label>
        <input class="field-input" id="targetInput" type="text" placeholder="예: MZ세대 직장인" maxlength="40">
      </div>
      <div class="field-group">
        <label class="field-lbl" for="ideaInput">💡 아이디어</label>
        <input class="field-input" id="ideaInput" type="text" placeholder="벼락같은 아이디어를 던져보세요!">
      </div>
      <button class="post-btn" id="postBtn">⚡ 붙이기</button>
    </div>
    <div class="input-bottom">
      <span class="color-label">색상</span>
      <div class="swatches" id="swatches"></div>
      <div class="nick-divider"></div>
      <span class="nick-label">닉네임</span>
      <span class="nick-badge" id="nickPreview">?</span>
    </div>
  </div>
  <div class="wall-header">
    <span class="wall-count" id="noteCount">0개의 아이디어</span>
    <div class="filter-row" id="filterRow">
      <button class="chip active" data-filter="all">전체</button>
    </div>
  </div>
  <div class="wall" id="wall"></div>
</div>

<!-- ANALYSIS -->
<div class="panel" id="panel-analysis">
  <div class="stat-grid" id="statGrid"></div>
  <div class="analysis-refresh-row">
    <span class="analysis-update-time" id="analysisUpdateTime">아직 분석 전이에요</span>
    <button class="refresh-btn" onclick="refreshAllAnalysis()">🔄 전체 갱신</button>
  </div>
  <div class="analysis-grid">
    <div class="result-card" id="card-cluster">
      <div class="result-title">🗂 유형별 묶기</div>
      <div class="result-body result-empty">아이디어를 입력하면 자동으로 분석돼요</div>
    </div>
    <div class="result-card" id="card-summary">
      <div class="result-title">📝 핵심 요약</div>
      <div class="result-body result-empty">아이디어를 입력하면 자동으로 분석돼요</div>
    </div>
    <div class="result-card full-width" id="card-expand">
      <div class="result-title">💡 아이디어 발전</div>
      <div class="result-body result-empty">아이디어를 입력하면 자동으로 분석돼요</div>
    </div>
  </div>
</div>

<!-- RANKING -->
<div class="panel" id="panel-ranking">
  <div class="rank-header">
    <span class="rank-title-txt">❤️ 공감 많이 받은 아이디어</span>
    <button class="reset-btn" onclick="resetVotes()">투표 초기화</button>
  </div>
  <div class="ranking-list" id="rankingList"></div>
</div>

<!-- STATS -->
<div class="panel" id="panel-stats">
  <div class="stat-grid" id="statsCards"></div>
  <div class="stats-section">
    <div class="stats-section-title">📌 아이디어 유형 분포</div>
    <div id="typeChart"></div>
  </div>
  <div class="result-card" id="card-teamprofile">
    <div class="result-title" style="justify-content:space-between">
      <span>🧠 팀 성향 분석</span>
      <span class="analysis-update-time" id="statsUpdateTime" style="font-size:11px;font-weight:400;color:var(--text3)">자동 갱신됨</span>
    </div>
    <div class="result-body result-empty" id="teamProfileBody">아이디어가 쌓이면 자동으로 분석돼요</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-title">⚡ 브레인스토밍 주제</div>
    <div class="modal-sub">팀 전체에 보이는 주제를 설정하세요.<br>방향이 있으면 벼락이 더 잘 떨어집니다 ㅋㅋ</div>
    <input class="modal-input" id="topicInput" type="text" placeholder="예: 2030 직장인을 위한 신규 앱 서비스" maxlength="60">
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn-solid" onclick="saveTopic()">설정 ⚡</button>
    </div>
  </div>
</div>

<script>
const SK = 'dambyeorak_v4';
const TK = 'dambyeorak_v4_topic';

/* ── 색상 4종 ── */
const COLORS = [
  { bg:'#FFF9C4', tc:'#5D4037' },
  { bg:'#B3E5FC', tc:'#01579B' },
  { bg:'#C8E6C9', tc:'#1B5E20' },
  { bg:'#F8BBD9', tc:'#880E4F' },
];

/* ── 자동 닉네임 ── */
const NICKS = ['⚡번개맞은두부','🌊파도치는고래','🦊꼬리아홉여우','🐙문어다리여덟','🌈무지개먹은곰','🍕피자좋아하는자','🚀우주로간감자','🦋날아다니는생각','🐧남극에서온펭귄','🌻해를따라가는꽃','🎯과녁맞힌화살','🦄뿔달린말씀드림','🍦녹기전에먹어','🐺달보고짖는늑대','🎪서커스단장님','🔮수정구슬굴리기','🌙달빛받은돌멩이','🍩구멍난도넛씨'];

/* ── 유형 사전 ── */
const TYPES = [
  { key:'커뮤니티형', icon:'👥', color:'#7C4DFF',
    words:['커뮤니티','모임','네트워크','연결','소통','그룹','공간','모여','함께'] },
  { key:'통신판매형', icon:'🛒', color:'#F57C00',
    words:['쇼핑','구매','판매','배달','거래','마켓','주문','상품','결제'] },
  { key:'오프라인형', icon:'🏪', color:'#388E3C',
    words:['오프라인','매장','공간','카페','방문','스토어','현장','직접'] },
  { key:'플랫폼형', icon:'🔗', color:'#0288D1',
    words:['앱','app','플랫폼','매칭','연결','마켓플레이스','모바일','서비스'] },
  { key:'구독서비스형', icon:'♻️', color:'#C2185B',
    words:['구독','월정액','정기','멤버십','프리미엄'] },
  { key:'B2B형', icon:'🤝', color:'#455A64',
    words:['기업','회사','업무','사무','비즈니스','직장','솔루션','b2b'] },
  { key:'콘텐츠형', icon:'🎨', color:'#E64A19',
    words:['콘텐츠','영상','미디어','크리에이터','교육','학습','강의','유튜브'] },
];

/* ── 키워드 사전 ── */
const KW_MAP = [
  ['앱서비스',   ['앱','app','어플','모바일','스마트폰']],
  ['AI추천',     ['ai','인공지능','추천','자동','머신러닝']],
  ['구독모델',   ['구독','월정액','정기','멤버십']],
  ['위치기반',   ['위치','gps','지도','근처','주변','동네']],
  ['커뮤니티',   ['커뮤니티','모임','네트워크','소통','그룹']],
  ['교육플랫폼', ['교육','학습','수업','강의','튜터','선생','공부']],
  ['헬스케어',   ['건강','헬스','운동','다이어트','병원','의료']],
  ['육아서비스', ['육아','아이','아동','어린이','유아','수기','수첩','부모']],
  ['구직플랫폼', ['구직','취업','알바','단기','채용','프리랜서']],
  ['음식서비스', ['음식','배달','밥','메뉴','식당','점심','요리']],
  ['전자상거래', ['쇼핑','구매','판매','거래','마켓','상품']],
  ['콘텐츠창작', ['콘텐츠','영상','유튜브','크리에이터','미디어']],
  ['게임화',     ['게임','미션','리워드','포인트','레벨','도전','클리어']],
  ['자동화도구', ['자동화','정리','관리','저장','파일','문서','기록']],
  ['B2B솔루션',  ['기업','회사','업무','사무','비즈니스','솔루션']],
  ['오프라인',   ['오프라인','매장','공간','카페','방문']],
  ['환경친화',   ['환경','친환경','재활용','에코','탄소']],
  ['반려동물',   ['반려','강아지','고양이','펫','동물']],
];

let notes = [];
let colorIdx = 0;
let currentFilter = 'all';
let myNick = '';

/* ── 저장/로드 ── */
function save() {
  try { localStorage.setItem(SK, JSON.stringify(notes)); } catch(e){}
  try {
    if (window._fbSet) {
      const data = {};
      notes.forEach(n => {
        data[n.id] = { ...n, time: n.time instanceof Date ? n.time.toISOString() : n.time };
      });
      window._fbSet('notes', data);
    }
  } catch(e) {}
}
function load() {
  try {
    const r = localStorage.getItem(SK);
    if (r) notes = JSON.parse(r).map(n => ({ ...n, time: new Date(n.time), keywords: n.keywords||[], likes: n.likes||0, myVote: n.myVote||false }));
  } catch(e) { notes = []; }
}

function startFirebaseSync() {
  if (!window._fbOnNotes) { setTimeout(startFirebaseSync, 300); return; }
  window._fbOnNotes(data => {
    if (!data) return;
    const myVotes = {};
    notes.forEach(n => { if (n.myVote) myVotes[n.id] = true; });
    notes = Object.values(data).map(n => ({
      ...n,
      time: new Date(n.time),
      keywords: n.keywords||[],
      likes: n.likes||0,
      myVote: myVotes[n.id]||false
    }));
    try { localStorage.setItem(SK, JSON.stringify(notes)); } catch(e){}
    renderWall(); updateFilters();
    autoRefreshAnalysis(); refreshTeamProfile();
  });
  window._fbOnTopic(t => {
    if (!t) return;
    localStorage.setItem(TK, t);
    document.getElementById('topicPill').textContent = '✦ ' + t;
  });
}

/* ── 닉네임 ── */
function assignNick() {
  let stored = localStorage.getItem('dambyeorak_nick');
  if (!stored) {
    stored = NICKS[Math.floor(Math.random() * NICKS.length)];
    localStorage.setItem('dambyeorak_nick', stored);
  }
  myNick = stored;
  const el = document.getElementById('nickPreview');
  if (el) el.textContent = myNick;
}

/* ── 주제 ── */
function openModal() {
  document.getElementById('topicInput').value = localStorage.getItem(TK)||'';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('topicInput').focus(), 50);
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function saveTopic() {
  const v = document.getElementById('topicInput').value.trim();
  if (!v) return;
  localStorage.setItem(TK, v);
  document.getElementById('topicPill').textContent = '✦ ' + v;
  if (window._fbSetTopic) window._fbSetTopic(v);
  closeModal();
}
function loadTopic() {
  const t = localStorage.getItem(TK)||'';
  if (t) document.getElementById('topicPill').textContent = '✦ ' + t;
}

/* ── 색상 스와치 ── */
function initSwatches() {
  const wrap = document.getElementById('swatches');
  COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 0 ? ' active' : '');
    el.style.background = c.bg;
    el.onclick = () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      colorIdx = i;
    };
    wrap.appendChild(el);
  });
}

/* ── 키워드/유형 분석 ── */
function analyze(target, txt) {
  const combined = (target + ' ' + txt).toLowerCase();

  // 키워드
  const scores = KW_MAP.map(([kw, patterns]) => ({
    kw, score: patterns.reduce((s, p) => s + (combined.includes(p) ? 1 : 0), 0)
  })).filter(x => x.score > 0).sort((a, b) => b.score - a.score);

  let keywords = scores.slice(0, 3).map(x => x.kw);
  if (keywords.length < 3) {
    const words = txt.replace(/[^가-힣a-zA-Z0-9\s]/g, ' ').split(/\s+/)
      .filter(w => w.length >= 2 && w.length <= 8)
      .filter(w => !['있는','하는','위한','하고','에서','으로','이를','그리고','하여','있음','현재','서비스','입니다','합니다'].includes(w));
    for (const w of [...new Set(words)]) {
      if (keywords.length >= 3) break;
      if (!keywords.includes(w)) keywords.push(w);
    }
  }
  while (keywords.length < 3) keywords.push(['디지털','신규사업','아이디어'][keywords.length]);

  // 유형
  let type = TYPES[3]; // 기본 플랫폼형
  let maxScore = 0;
  for (const t of TYPES) {
    const score = t.words.reduce((s, p) => s + (combined.includes(p) ? 1 : 0), 0);
    if (score > maxScore) { maxScore = score; type = t; }
  }

  return { keywords, type: type.key };
}

/* ── 노트 추가 ── */
function addNote() {
  const target = document.getElementById('targetInput').value.trim();
  const txt = document.getElementById('ideaInput').value.trim();
  if (!txt) { document.getElementById('ideaInput').focus(); return; }

  const { keywords, type } = analyze(target, txt);
  const c = COLORS[colorIdx];
  const note = {
    id: Date.now(), target, text: txt, nick: myNick,
    bg: c.bg, tc: c.tc, colorIdx,
    keywords, type, time: new Date(), likes: 0, myVote: false
  };
  notes.push(note);
  document.getElementById('targetInput').value = '';
  document.getElementById('ideaInput').value = '';
  document.getElementById('targetInput').focus();
  save(); renderWall(); updateFilters(); autoRefreshAnalysis(); refreshTeamProfile();
}

/* ── 삭제 ── */
function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  save(); renderWall(); updateFilters(); autoRefreshAnalysis(); refreshTeamProfile();
}

/* ── 공감 ── */
function toggleLike(id) {
  const idx = notes.findIndex(n => n.id === id);
  if (idx < 0) return;
  if (notes[idx].myVote) {
    notes[idx].likes = Math.max(0, notes[idx].likes - 1);
    notes[idx].myVote = false;
  } else {
    notes[idx].likes++;
    notes[idx].myVote = true;
  }
  save(); renderWall();
}

/* ── 필터 ── */
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderWall();
}

function updateFilters() {
  const row = document.getElementById('filterRow');
  row.querySelectorAll('[data-filter]:not([data-filter="all"])').forEach(c => c.remove());
  const usedTypes = [...new Set(notes.map(n => n.type).filter(Boolean))];
  usedTypes.forEach(t => {
    const ti = TYPES.find(x => x.key === t);
    const chip = document.createElement('button');
    chip.className = 'chip' + (currentFilter === t ? ' active' : '');
    chip.dataset.filter = t;
    chip.textContent = (ti ? ti.icon : '💡') + ' ' + t;
    chip.onclick = () => setFilter(t, chip);
    row.appendChild(chip);
  });
}

/* ── 담벼락 렌더 ── */
function renderWall() {
  const wall = document.getElementById('wall');
  let list = currentFilter === 'all' ? notes : notes.filter(n => n.type === currentFilter);
  const count = document.getElementById('noteCount');
  count.textContent = list.length + '개의 아이디어' + (notes.length !== list.length ? ' (필터 중)' : '');

  if (list.length === 0) {
    wall.innerHTML = '<div class="empty-wall">아직 아이디어가 없어요 ⚡<br>첫 번째 포스트잇을 붙여보세요!</div>';
    return;
  }

  wall.innerHTML = [...list].reverse().map(n => {
    const ti = TYPES.find(x => x.key === n.type) || TYPES[3];
    const heart = n.myVote ? '♥' : '♡';
    const heartColor = n.myVote ? '#dd3333' : 'rgba(0,0,0,0.3)';
    return `<div class="note" style="background:${n.bg};color:${n.tc}">
      <button class="note-del" onclick="deleteNote(${n.id})" style="color:${n.tc}">×</button>
      <div class="note-nick">${esc(n.nick||'익명')}</div>
      ${n.target ? `<div class="note-target">👤 ${esc(n.target)}</div>` : ''}
      <div class="note-text">${esc(n.text)}</div>
      <hr class="note-divider">
      <div class="note-keywords">${n.keywords.map(k => `<span class="kw">#${esc(k)}</span>`).join('')}</div>
      <span class="note-type" style="background:${ti.color}22;color:${ti.color}">${ti.icon} ${ti.key}</span>
      <div class="note-meta">
        <span class="note-time">${fmtTime(n.time)}</span>
        <button class="like-btn ${n.myVote ? 'liked' : ''}" onclick="toggleLike(${n.id})">
          <span class="heart" style="color:${heartColor}">${heart}</span>
          <span>${n.likes}</span>
        </button>
      </div>
    </div>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(d) { return d instanceof Date && !isNaN(d) ? d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : ''; }

/* ── 분석 ── */
function renderStatGrid() {
  const today = new Date().toDateString();
  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="stat-n">${notes.length}</div><div class="stat-l">전체 아이디어</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#FF6B35">${notes.filter(n => n.time instanceof Date && n.time.toDateString()===today).length}</div><div class="stat-l">오늘 추가</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#4ECDC4">${[...new Set(notes.map(n=>n.type).filter(Boolean))].length}</div><div class="stat-l">아이디어 유형</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#9C27B0">${notes.filter(n=>(n.likes||0)>0).length}</div><div class="stat-l">공감받은 수</div></div>`;
}

function refreshAllAnalysis() {
  if (!notes.length) { alert('먼저 아이디어를 입력해주세요!'); return; }
  const topic = localStorage.getItem(TK) || '신규 사업';
  ['cluster','summary','expand'].forEach(type => {
    const body = document.querySelector('#card-'+type+' .result-body');
    if (body) { body.textContent = getAnalysis(type, topic); body.classList.remove('result-empty'); }
  });
  const now = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  const timeEl = document.getElementById('analysisUpdateTime');
  if (timeEl) timeEl.textContent = now + ' 갱신됨';
}

function autoRefreshAnalysis() {
  if (!notes.length) return;
  refreshAllAnalysis();
}

function getAnalysis(type, topic) {
  const byType = {};
  notes.forEach(n => { const t = n.type||'미분류'; (byType[t] = byType[t]||[]).push(n); });
  const sortedTypes = Object.entries(byType).sort((a,b) => b[1].length - a[1].length);
  const allKw = notes.flatMap(n => n.keywords||[]);
  const kwCount = {};
  allKw.forEach(k => kwCount[k] = (kwCount[k]||0)+1);
  const topKw = Object.entries(kwCount).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
  const byLikes = [...notes].sort((a,b)=>(b.likes||0)-(a.likes||0));

  if (type === 'cluster') {
    return `[주제: ${topic}]\n\n` + sortedTypes.map(([t,ns]) =>
      `${TYPES.find(x=>x.key===t)?.icon||'💡'} ${t} — ${ns.length}개\n` +
      ns.map(n => `  • ${n.text.slice(0,45)}${n.text.length>45?'…':''}`).join('\n')
    ).join('\n\n');
  }
  if (type === 'summary') {
    const top3 = byLikes.slice(0,3).map((n,i)=>`${i+1}. ${n.text.slice(0,50)}${n.text.length>50?'…':''} (❤️${n.likes||0})`).join('\n');
    return `[주제: ${topic}]\n\n📊 전체 ${notes.length}개\n🏷 자주 등장한 키워드: ${topKw.join(', ')||'없음'}\n🎯 주요 유형: ${sortedTypes[0]?.[0]||'없음'}\n\n공감 Top 3:\n${top3}`;
  }
  if (type === 'expand') {
    return `[주제: ${topic}]\n\n` + byLikes.slice(0,3).map((n,i) =>
      `${i+1}. "${n.text.slice(0,55)}"\n   대상: ${n.target||'미정'} | 유형: ${n.type||'미분류'}\n   키워드: ${(n.keywords||[]).join(', ')||'없음'}\n   → 다음 스텝: 고객 인터뷰 → 프로토타입 → 검증`
    ).join('\n\n');
  }
  if (type === 'gap') {
    const used = new Set(notes.map(n=>n.type));
    const missing = TYPES.filter(t=>!used.has(t.key)).slice(0,3);
    const targets = [...new Set(notes.map(n=>n.target).filter(Boolean))];
    return `[주제: ${topic}]\n\n🔍 아직 탐색 안 한 유형:\n${missing.length ? missing.map(t=>`  ${t.icon} ${t.key}`).join('\n') : '  모든 유형 커버 중!'}\n\n👥 다뤄진 대상:\n${targets.length ? targets.map(t=>`  • ${t}`).join('\n') : '  • 아직 대상 미설정'}\n\n❓ 팀이 던져볼 질문:\n  • 이 아이디어들의 공통 수익 모델은?\n  • 기존 경쟁 서비스와 차별점은?`;
  }
  if (type === 'mvp') {
    return `[주제: ${topic}]\n\n` + byLikes.slice(0,3).map((n,i) =>
      `🚀 ${i+1}. "${n.text.slice(0,50)}"\n   유형: ${n.type||'미분류'}\n   MVP 스텝: 노코드 프로토타입 → 10명 테스트 → 피드백 수집\n   예상 기간: 2~4주`
    ).join('\n\n');
  }
  return '';
}

/* ── 공감 랭킹 ── */
function renderRanking() {
  const list = document.getElementById('rankingList');
  const sorted = [...notes].filter(n=>(n.likes||0)>0).sort((a,b)=>(b.likes||0)-(a.likes||0));
  if (!sorted.length) {
    list.innerHTML = '<div class="no-votes">아직 공감을 받은 아이디어가 없어요 😅<br>담벼락에서 ❤️ 눌러보세요!</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  list.innerHTML = sorted.map((n, i) => {
    const ti = TYPES.find(x=>x.key===n.type)||TYPES[3];
    const rankClass = i < 3 ? `rank-${i+1}` : '';
    const rankIcon = i < 3 ? `<div class="rank-medal">${medals[i]}</div>` : `<div class="rank-num">${i+1}</div>`;
    return `<div class="rank-item ${rankClass}">
      ${rankIcon}
      <div class="rank-note" style="background:${n.bg};color:${n.tc}">
        <div class="rank-note-nick">${esc(n.nick||'익명')}</div>
        ${n.target ? `<div class="rank-note-target">👤 ${esc(n.target)}</div>` : ''}
        <div class="rank-note-text">${esc(n.text)}</div>
        <div class="rank-note-kws">${(n.keywords||[]).map(k=>`<span class="rank-kw">#${esc(k)}</span>`).join('')}</div>
      </div>
      <div class="rank-likes">❤️ ${n.likes}</div>
    </div>`;
  }).join('');
}

function resetVotes() {
  if (!confirm('모든 공감을 초기화할까요?')) return;
  notes.forEach(n => { n.likes=0; n.myVote=false; });
  save(); renderRanking(); renderWall();
}

/* ── 통계 ── */
function renderStats() {
  const today = new Date().toDateString();
  document.getElementById('statsCards').innerHTML = `
    <div class="stat-card"><div class="stat-n">${notes.length}</div><div class="stat-l">전체 아이디어</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#FF6B35">${notes.filter(n=>n.time instanceof Date&&n.time.toDateString()===today).length}</div><div class="stat-l">오늘 추가</div></div>
    <div class="stat-card"><div class="stat-n" style="color:#4ECDC4">${[...new Set(notes.map(n=>n.type).filter(Boolean))].length}</div><div class="stat-l">유형 수</div></div>`;

  const total = Math.max(1, notes.length);
  const typeCounts = {};
  notes.forEach(n => { if(n.type) typeCounts[n.type]=(typeCounts[n.type]||0)+1; });
  document.getElementById('typeChart').innerHTML = TYPES.filter(t=>typeCounts[t.key]).sort((a,b)=>(typeCounts[b.key]||0)-(typeCounts[a.key]||0)).map(t => {
    const v = typeCounts[t.key]||0;
    const pct = Math.round(v/total*100);
    return `<div class="bar-row">
      <div class="bar-label">${t.icon} ${t.key}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${t.color}"></div></div>
      <div class="bar-val">${v}</div>
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:13px;padding:8px 0">아직 분류된 아이디어가 없어요</div>';


}

function refreshTeamProfile() {
  if (!notes.length) return;
  const typeCounts = {};
  notes.forEach(n => { if(n.type) typeCounts[n.type]=(typeCounts[n.type]||0)+1; });
  const sorted = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]);
  const allKw = notes.flatMap(n=>n.keywords||[]);
  const kwCount = {};
  allKw.forEach(k => kwCount[k]=(kwCount[k]||0)+1);
  const topKw = Object.entries(kwCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`${k}(${v}회)`);
  const targets = notes.map(n=>n.target).filter(Boolean);
  const targetCount = {};
  targets.forEach(t => targetCount[t]=(targetCount[t]||0)+1);
  const topTargets = Object.entries(targetCount).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`${k}(${v}개)`);

  const result = `📊 유형 분포:\n${sorted.map(([t,n])=>`  • ${t}: ${n}개 ${'█'.repeat(Math.min(n,10))}`).join('\n')}\n\n🏷 자주 쓰인 키워드:\n  ${topKw.join(', ')||'없음'}\n\n👥 주요 타겟:\n  ${topTargets.join(', ')||'미설정'}\n\n🎯 성향 요약:\n  → 주력 방향: ${sorted[0]?.[0]||'다양'}\n  → 핵심 키워드: ${topKw.slice(0,3).map(k=>k.split('(')[0]).join(' · ')||'없음'}`;

  const body = document.getElementById('teamProfileBody');
  if (body) { body.textContent = result; body.classList.remove('result-empty'); }
  const timeEl = document.getElementById('statsUpdateTime');
  if (timeEl) {
    const now = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    timeEl.textContent = now + ' 갱신';
  }
}

/* ── 탭 전환 ── */
function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
  if (id==='analysis') { renderStatGrid(); autoRefreshAnalysis(); }
  if (id==='ranking') renderRanking();
  if (id==='stats') { renderStats(); refreshTeamProfile(); }
}

/* ── 키보드 ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id==='targetInput'||e.target.id==='ideaInput')) {
    e.preventDefault(); addNote();
  }
  if (e.key === 'Enter' && e.target.id==='topicInput') {
    e.preventDefault(); saveTopic();
  }
});

/* ── 초기화 ── */
document.getElementById('postBtn').addEventListener('click', addNote);
load(); assignNick(); loadTopic(); initSwatches(); renderWall(); updateFilters(); startFirebaseSync();
</script>
</body>
</html>
